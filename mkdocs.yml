site_name: Profanex
site_url: https://jyablonski.github.io/profanex/
site_description: Fast Rust-powered profanity detection and filtering for Python with Unicode-safe spans, fuzzy matching, allowlists, and parallel batches.
repo_url: https://github.com/jyablonski/profanex
repo_name: jyablonski/profanex
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site
strict: true

theme:
  name: material
  language: en
  features:
    - content.code.copy
    - navigation.sections
    - navigation.top
  palette:
    scheme: default
    primary: indigo
    accent: blue

nav:
  - Overview: index.md
  - API reference: api.md
  - Configuration: configuration.md
  - How it works: how_it_works.md
  - Accuracy: accuracy.md
  - Benchmarks: benchmarks.md
  - Competitive benchmarks: competitive-benchmarks.md
  - Limitations: limitations.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - tables
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - toc:
      permalink: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: ["."]
          options:
            docstring_style: google
            heading_level: 3
            members_order: source
            separate_signature: true
            show_root_heading: true
            show_source: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            signature_crossrefs: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/jyablonski/profanex

copyright: Profanex software is MIT licensed; the packaged banned lexicon is CC BY 4.0.
