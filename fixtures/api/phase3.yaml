# Phase 3 optional normalization + fuzzy contract fixtures.

cases:
  - id: repeated_chars_on
    text: "fuuuck"
    config:
      banned: ["fuck"]
      allowlist: []
      normalize_repeated_chars: true
    expect_contains: true
    expect_matches:
      - { start: 0, end: 6, text: "fuuuck", term: "fuck", kind: exact, score: 100.0 }

  - id: separated_runs_on
    text: "f.u.c.k"
    config:
      banned: ["fuck"]
      allowlist: []
      normalize_separated_runs: true
    expect_contains: true
    expect_matches:
      - { start: 0, end: 7, text: "f.u.c.k", term: "fuck", kind: exact, score: 100.0 }

  - id: fuzzy_typo
    text: "fukc"
    config:
      banned: ["fuck"]
      allowlist: []
      enable_fuzzy: true
      threshold: 75
      min_fuzzy_len: 4
    expect_contains: true
    expect_matches:
      - { start: 0, end: 4, text: "fukc", term: "fuck", kind: fuzzy }
