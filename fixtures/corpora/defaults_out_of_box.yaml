# Out-of-the-box recall / gap inventory against Filter() defaults.
#
# Default policy (no config): all categories, word_boundaries=True, enable_fuzzy=False,
# normalize_leet=True, normalize_repeated_chars=False, normalize_separated_runs=False.
#
# Fields:
#   expect_contains  — required CI behavior under the case config (defaults when omitted)
#   expect_terms     — optional; matched term strings that must appear (span-free)
#   desired_contains — optional aspirational OOB behavior for gap reports
#   gap              — optional machine-readable gap class when desired != current
#   notes            — human context
#   group            — suite section for reporting
#
# Gap classes:
#   lexicon          — term missing from banned_words.yaml
#   word_boundary    — stem present but blocked mid-token (e.g. fucking)
#   needs_repeated   — needs normalize_repeated_chars=True
#   needs_separated  — needs normalize_separated_runs=True
#   needs_fuzzy      — needs enable_fuzzy=True
#   needs_leet_ext   — common mask chars not in default leet map (*, etc.)
#   policy           — intentional allowlist / mild-language exclusion

